<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Col·lecció Ortín-Escudé</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' fill='%23f6f1e6'/%3E%3Crect x='6' y='6' width='68' height='68' fill='none' stroke='%231a1814' stroke-width='2'/%3E%3Ctext x='40' y='51' text-anchor='middle' font-family='Georgia,serif' font-size='30' fill='%231a1814'%3EOE%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    /* ─────────────────────────────────────────────────────────────
       Col·lecció Ortín-Escudé — estils
       ───────────────────────────────────────────────────────────── */

    :root {
      --paper:        oklch(0.972 0.012 82);
      --paper-deep:   oklch(0.945 0.018 82);
      --ink:          #1a1814;
      --ink-soft:     #4a463f;
      --ink-muted:    #8a8478;
      --rule:         oklch(0.88 0.012 82);
      --accent:       oklch(0.48 0.06 55); /* terracota apagada */
      --serif:        "Cormorant Garamond", "EB Garamond", Georgia, serif;
      --sans:         "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono:         "JetBrains Mono", ui-monospace, Menlo, monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body { min-height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1; }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ─── Header ──────────────────────────────────────────────── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: color-mix(in oklab, var(--paper) 92%, transparent);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--rule);
    }
    .site-header__inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .site-header__nav {
      display: flex;
      gap: 28px;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .site-header__nav a { transition: color 0.2s; }
    .site-header__nav a:hover,
    .site-header__nav a.is-active { color: var(--ink); }
    .site-header__nav .is-disabled { opacity: 0.4; cursor: default; }

    /* ─── Logo ────────────────────────────────────────────────── */
    .logo { display: flex; align-items: center; gap: 14px; color: var(--ink); }
    .logo__mark { width: 38px; height: 38px; flex-shrink: 0; }
    .logo__name {
      font-family: var(--serif);
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 0.02em;
      line-height: 1;
    }

    /* ─── Estat (càrrega / error) ────────────────────────────── */
    .status {
      max-width: 1320px;
      margin: 0 auto;
      padding: 120px 40px;
      text-align: center;
      font-family: var(--serif);
      font-style: italic;
      font-size: 20px;
      color: var(--ink-muted);
    }

    /* ─── Galeria — graella ──────────────────────────────────── */
    .gallery {
      max-width: 1320px;
      margin: 0 auto;
      padding: 40px 40px 0;
    }
    .gallery__count {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 0 0 32px 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 64px 40px;
    }
    .card { display: flex; flex-direction: column; gap: 18px; }
    .card__figure {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4 / 5;
      background: var(--paper-deep);
    }
    .card__figure img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 1.2s cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    .card:hover .card__figure img { transform: scale(1.02); }
    .card__number {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--ink-muted);
      margin-bottom: 8px;
    }
    .card__title {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 24px;
      line-height: 1.15;
      margin: 0 0 6px 0;
      text-wrap: balance;
    }
    .card__author {
      font-family: var(--serif);
      font-style: italic;
      font-size: 16px;
      color: var(--ink-soft);
      margin: 0 0 12px 0;
    }
    .card__meta {
      font-size: 10.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    /* ─── Placeholder sense foto ─────────────────────────────── */
    .no-photo {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--serif);
      font-style: italic;
      font-size: 17px;
      color: var(--ink-soft);
    }
    .no-photo--0 { background: oklch(0.93 0.025 82); }
    .no-photo--1 { background: oklch(0.90 0.03 60); }
    .no-photo--2 { background: oklch(0.91 0.02 140); }
    .no-photo--3 { background: oklch(0.90 0.018 240); }
    .no-photo--4 { background: oklch(0.89 0.035 45); }

    /* ─── Detall d'una obra ──────────────────────────────────── */
    .detail {
      max-width: 1320px;
      margin: 0 auto;
      padding: 64px 40px 120px;
    }
    .detail__back {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-soft);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 56px;
    }
    .detail__back:hover { color: var(--ink); }
    .detail__header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 32px;
      align-items: end;
      padding-bottom: 40px;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 56px;
    }
    .detail__eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--ink-muted);
      margin: 0 0 18px 0;
      text-transform: uppercase;
    }
    .detail__title {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(36px, 4.6vw, 64px);
      line-height: 1.04;
      letter-spacing: -0.012em;
      margin: 0 0 14px 0;
      text-wrap: balance;
    }
    .detail__author {
      font-family: var(--serif);
      font-style: italic;
      font-size: 21px;
      color: var(--ink-soft);
      margin: 0;
    }
    .detail__year {
      font-family: var(--serif);
      font-size: 56px;
      font-weight: 300;
      color: var(--ink-muted);
      line-height: 1;
    }
    .detail__body {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
      gap: 80px;
      align-items: start;
    }
    .detail__image { background: var(--paper-deep); overflow: hidden; }
    .detail__image img { width: 100%; height: auto; }
    .detail__image .no-photo { aspect-ratio: 4 / 5; font-size: 22px; }
    .detail__sidebar { position: sticky; top: 100px; }
    .detail__desc {
      font-family: var(--serif);
      font-size: 19px;
      line-height: 1.55;
      color: var(--ink-soft);
      margin: 0 0 40px 0;
      text-wrap: pretty;
    }
    .fact-table { border-top: 1px solid var(--ink); margin: 0; }
    .fact-row {
      display: grid;
      grid-template-columns: 42% 1fr;
      gap: 16px;
      align-items: baseline;
      padding: 14px 0;
      border-bottom: 1px solid var(--rule);
    }
    .fact-row dt,
    .fact-row dd { margin: 0; line-height: 1.4; }
    .fact-row dt {
      font-size: 10.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }
    .fact-row dd {
      font-family: var(--serif);
      font-size: 16px;
      text-align: right;
    }
    .fact-table a { border-bottom: 1px solid var(--ink-muted); padding-bottom: 1px; }

    /* ─── Fes una oferta ─────────────────────────────────────── */
    .offer { margin-top: 40px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
    .offer__btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--ink);
      color: var(--paper);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding: 16px 26px;
      transition: gap 0.25s, background 0.2s;
    }
    .offer__btn:hover { gap: 18px; background: var(--accent); }
    .offer__alt {
      font-size: 12px;
      color: var(--ink-muted);
    }
    .offer__copy {
      font: inherit;
      color: var(--ink-soft);
      background: none;
      border: 0;
      padding: 0;
      border-bottom: 1px solid var(--ink-muted);
      cursor: pointer;
    }
    .offer__copy:hover { color: var(--ink); }

    /* ─── Footer ─────────────────────────────────────────────── */
    .site-footer {
      border-top: 1px solid var(--rule);
      margin-top: 96px;
      padding: 40px;
    }
    .site-footer__inner {
      max-width: 1320px;
      margin: 0 auto;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    /* ─── Responsive ─────────────────────────────────────────── */
    @media (max-width: 1080px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 820px) {
      .site-header__inner { padding: 14px 20px; gap: 12px; }
      .site-header__nav { gap: 16px; font-size: 10px; letter-spacing: 0.14em; }
      .logo__mark { width: 32px; height: 32px; }
      .logo__name { font-size: 16px; }

      .status { padding: 80px 20px; }
      .gallery { padding: 28px 20px 0; }
      .detail { padding: 32px 20px 80px; }
      .detail__back { margin-bottom: 32px; }
      .detail__header {
        grid-template-columns: 1fr;
        gap: 16px;
        margin-bottom: 32px;
        padding-bottom: 24px;
      }
      .detail__year { font-size: 36px; }
      .detail__body { grid-template-columns: 1fr; gap: 40px; }
      .detail__sidebar { position: static; }
      .detail__desc { font-size: 17px; }
      .fact-row { grid-template-columns: 1fr; gap: 4px; }
      .fact-row dd { text-align: left; }
      .offer__btn { width: 100%; justify-content: center; }

      .site-footer { padding: 24px 20px; margin-top: 64px; }
    }
    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; gap: 48px; }
      .logo__name { font-size: 15px; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a href="#/" class="logo" aria-label="Col·lecció Ortín-Escudé — inici">
      <svg class="logo__mark" viewBox="0 0 80 80" aria-hidden="true">
        <rect x="6" y="6" width="68" height="68" fill="none" stroke="currentColor" stroke-width="1.4"></rect>
        <rect x="12" y="12" width="56" height="56" fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.55"></rect>
        <text x="40" y="50.5" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" font-weight="500" fill="currentColor" letter-spacing="-0.5">OE</text>
        <line x1="35" y1="58" x2="45" y2="58" stroke="currentColor" stroke-width="0.8"></line>
      </svg>
      <span class="logo__name">Col·lecció Ortín-Escudé</span>
    </a>
    <nav class="site-header__nav">
      <a href="#/" class="is-active">Obres</a>
      <span class="is-disabled" aria-disabled="true" title="Properament">Llibres</span>
    </nav>
  </div>
</header>

<main id="app">
  <div class="status">Carregant la col·lecció…</div>
</main>

<footer class="site-footer">
  <div class="site-footer__inner">© Col·lecció Ortín-Escudé</div>
</footer>

<script>
  // ─── Configuració ──────────────────────────────────────────
  const SHEET_ID = '1f8HHAOD0xZ0JKr1LHRxvbPEkplWMtI6hWt6jC8_ebDs';
  const GID = '0';
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}`;
  // Correu per a les ofertes, partit per evitar scrapers simples
  const EMAIL_PARTS = ['jordi.escude.godia', 'gmail.com'];

  // Capçaleres del full → claus internes. Preu, Preu de venta i Nota no es mostren mai.
  const FIELD_MAP = {
    'Títol': 'titol', 'Titol': 'titol',
    'Autor': 'autor',
    'Any Compra': 'anyCompra',
    'Any Producció': 'anyProduccio', 'Any Produccio': 'anyProduccio',
    'Estil': 'estil',
    'Tipus': 'tipus',
    'Descripció': 'descripcio', 'Descripcio': 'descripcio',
    'Foto': 'foto',
    'Lloc': 'lloc',
    'Wiki': 'wiki'
  };

  const app = document.getElementById('app');
  let works = [];
  let galleryScroll = 0;

  // ─── Utilitats ─────────────────────────────────────────────
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');

  function clean(v) {
    if (v === null || v === undefined) return '';
    return String(v).trim();
  }

  function slugify(s) {
    return s.normalize('NFD').replace(/[̀-ͯ]/g, '')
      .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  // Retorna la llista d'URLs candidates per a la foto (buida si no n'hi ha).
  // Per als enllaços de Google Drive (/file/d/<ID>/view, open?id=<ID>, uc?id=<ID>…)
  // s'extreu l'ID i es proven dues URLs de miniatura, per ordre.
  function photoUrls(v) {
    if (!/^https?:\/\//i.test(v)) return [];
    if (!/drive\.google\.com/.test(v)) return [v];
    const id = (v.match(/\/d\/([\w-]+)|[?&]id=([\w-]+)/) || []).slice(1).find(Boolean);
    return id ? [
      `https://drive.google.com/thumbnail?id=${id}&sz=w1000`,
      `https://lh3.googleusercontent.com/d/${id}=w1000`
    ] : [];
  }

  const placeholder = w => `<div class="no-photo no-photo--${w.index % 5}">Foto no disponible</div>`;

  function figureHtml(w) {
    if (!w.fotos.length) return placeholder(w);
    return `<img src="${esc(w.fotos[0])}" alt="${esc(w.titol)}" referrerpolicy="no-referrer" data-i="${w.index}" data-try="0">`;
  }

  // Si una imatge falla, prova la següent URL candidata; si no n'hi ha, posa el placeholder.
  document.addEventListener('error', e => {
    const img = e.target;
    if (img.tagName !== 'IMG' || !img.dataset.i) return;
    const w = works[img.dataset.i];
    const next = Number(img.dataset.try) + 1;
    console.warn('Imatge no carregada:', img.src);
    if (next < w.fotos.length) {
      img.dataset.try = next;
      img.src = w.fotos[next];
    } else {
      img.outerHTML = placeholder(w);
    }
  }, true);

  // ─── Dades ─────────────────────────────────────────────────
  async function loadWorks() {
    const text = await (await fetch(SHEET_URL)).text();
    const start = text.indexOf('{');
    const end = text.lastIndexOf('}');
    if (start === -1 || end === -1) throw new Error('Resposta del full no vàlida');
    const table = JSON.parse(text.substring(start, end + 1)).table;
    const headers = table.cols.map(c => (c.label || c.id || '').trim());
    const used = new Set();

    return table.rows
      .map(row => {
        const obj = {};
        (row.c || []).forEach((cell, i) => {
          const key = FIELD_MAP[headers[i]];
          if (key) obj[key] = clean(cell && cell.v);
        });
        return obj;
      })
      .filter(o => Object.values(o).some(Boolean))
      .map((o, i) => {
        const autor = (!o.autor || /^n\/?a$/i.test(o.autor)) ? 'Autor desconegut' : o.autor;
        let slug = slugify(o.titol || '') || String(i + 1);
        if (used.has(slug)) { let n = 2; while (used.has(`${slug}-${n}`)) n++; slug = `${slug}-${n}`; }
        used.add(slug);
        return {
          ...o,
          index: i,
          slug,
          titol: o.titol || 'Sense títol',
          autor,
          fotos: photoUrls(o.foto || ''),
          wiki: /^https?:\/\//i.test(o.wiki || '') ? o.wiki : ''
        };
      });
  }

  // ─── Vistes ────────────────────────────────────────────────
  function renderGallery() {
    document.title = 'Col·lecció Ortín-Escudé';
    const total = pad(works.length);
    app.innerHTML = `
      <section class="gallery">
        <p class="gallery__count">${works.length} obres</p>
        <div class="grid">
          ${works.map(w => `
            <a class="card" href="#/obra/${encodeURIComponent(w.slug)}" aria-label="Veure fitxa de ${esc(w.titol)}">
              <div class="card__figure">${figureHtml(w)}</div>
              <div>
                <div class="card__number">N.º ${pad(w.index + 1)} / ${total}</div>
                <h2 class="card__title">${esc(w.titol)}</h2>
                <p class="card__author">${esc(w.autor)}${w.anyProduccio ? `, ${esc(w.anyProduccio)}` : ''}</p>
                <div class="card__meta">${[w.estil, w.tipus].filter(Boolean).map(esc).join(' · ')}</div>
              </div>
            </a>
          `).join('')}
        </div>
      </section>
    `;
    window.scrollTo(0, galleryScroll);
  }

  function renderDetail(w) {
    document.title = `${w.titol} — Col·lecció Ortín-Escudé`;
    const email = EMAIL_PARTS.join('@');
    const subject = `Oferta: ${w.titol} — ${w.autor}`;
    const body = `Hola,\n\nM'interessa l'obra "${w.titol}" (${w.autor}).\n\nLa meva oferta és de ___ €.\n\nNom:\nTelèfon:\n\nGràcies.`;
    const mailto = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

    const rows = [
      ['Títol', esc(w.titol)],
      ['Autor', esc(w.autor)],
      ['Any de producció', esc(w.anyProduccio)],
      ['Any de compra', esc(w.anyCompra)],
      ['Estil', esc(w.estil)],
      ['Tipus', esc(w.tipus)],
      ['Procedència', esc(w.lloc)],
      ['Enllaç Wiki', w.wiki ? `<a href="${esc(w.wiki)}" target="_blank" rel="noopener">Veure article ↗</a>` : '']
    ].filter(([, v]) => v);

    app.innerHTML = `
      <section class="detail">
        <a class="detail__back" href="#/">
          <svg width="18" height="10" viewBox="0 0 18 10" fill="none" aria-hidden="true">
            <path d="M18 5H2M6 1L2 5l4 4" stroke="currentColor" stroke-width="1"></path>
          </svg>
          Tornar a la galeria
        </a>
        <header class="detail__header">
          <div>
            <p class="detail__eyebrow">N.º ${pad(w.index + 1)} / ${pad(works.length)}${w.estil ? ` · ${esc(w.estil)}` : ''}</p>
            <h1 class="detail__title">${esc(w.titol)}</h1>
            <p class="detail__author">${esc(w.autor)}</p>
          </div>
          ${w.anyProduccio ? `<div class="detail__year">${esc(w.anyProduccio)}</div>` : ''}
        </header>
        <div class="detail__body">
          <div class="detail__image">${figureHtml(w)}</div>
          <aside class="detail__sidebar">
            ${w.descripcio ? `<p class="detail__desc">${esc(w.descripcio)}</p>` : ''}
            <dl class="fact-table">
              ${rows.map(([k, v]) => `<div class="fact-row"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}
            </dl>
            <div class="offer">
              <a class="offer__btn" href="${esc(mailto)}">
                Fes una oferta
                <svg width="18" height="10" viewBox="0 0 18 10" fill="none" aria-hidden="true">
                  <path d="M0 5h16M12 1l4 4-4 4" stroke="currentColor" stroke-width="1"/>
                </svg>
              </a>
              <span class="offer__alt">No s'obre el correu? <button type="button" class="offer__copy" id="copyEmail">Copia l'adreça</button></span>
            </div>
          </aside>
        </div>
      </section>
    `;

    document.getElementById('copyEmail').addEventListener('click', async e => {
      const btn = e.currentTarget;
      try {
        await navigator.clipboard.writeText(email);
        btn.textContent = 'Copiada!';
      } catch {
        btn.textContent = email;
      }
    });
    window.scrollTo(0, 0);
  }

  // ─── Router ────────────────────────────────────────────────
  let onDetail = false;
  function route() {
    const m = location.hash.match(/^#\/obra\/(.+)$/);
    if (m) {
      if (!onDetail) galleryScroll = window.scrollY;
      const w = works.find(x => x.slug === decodeURIComponent(m[1]));
      if (!w) return location.replace('#/');
      onDetail = true;
      return renderDetail(w);
    }
    onDetail = false;
    renderGallery();
  }

  window.addEventListener('hashchange', route);

  loadWorks()
    .then(data => { works = data; route(); })
    .catch(err => {
